# Blank issues stay on. Settings → About → Report a problem opens the bug form
# (bug_report.yml, with Yap's version, Windows and the graphics card filled in:
# privacy/diagnostics.rs `issue_url`), but an older Yap still opens a blank
# issue with a prefilled body, which a forms-only chooser would drop.
blank_issues_enabled: true
contact_links:
  - name: Questions and help
    url: https://github.com/nayballs/Yap/discussions
    about: How do I…? Is this normal? Ask in Discussions.
  - name: Report a security vulnerability
    url: https://github.com/nayballs/Yap/security/advisories/new
    about: Privately, please, not as an issue (SECURITY.md).
