# End-to-end UI tests (desktop/e2e/, docs/e2e-tests.md). Builds the STUB debug app
# with the frontend embedded once, then runs the suite in eight shards side by
# side, each launching the app isolated (portable data dir, its own WebView2
# profile, test mode) and driving every window with Playwright over CDP.
# Screenshots, the HTML report and the app's logs are uploaded as the
# `e2e-results-<shard>` artifacts on every run, pass or fail:
#   gh run download <run-id> --repo nayballs/Yap --name e2e-results-1
# Separate from ci.yml so that quick lint gate stays quick. The runner has no
# audio devices, so this also proves Yap starts and works without a mic.
#
# How it got here: the whole suite on one runner outgrew the 30-minute limit
# (24 Oct 2026), one of two shards the 40-minute one (2 Nov), and by 16 Nov
# three shards of Playwright's own --shard ran 31–37 minutes of tests each,
# after a 4-minute build each: most runs hit the 40-minute limit, and main had
# no finished run for two days. Now one build, handed to eight shards split by
# time (desktop/e2e/shards.mjs: about 12.5 minutes of tests each).
name: "E2E"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      workers:
        description: "Test Yaps at once on each runner (Playwright workers)"
        required: false
        default: "1"

# Read-only token: no job here writes to the repo (CodeQL's actions/missing-workflow-permissions).
permissions:
  contents: read

# A newer push supersedes a branch's run in progress. Not main's: a run there
# always finishes, so every batch of merges gets a result (the newest push
# waits for it; one waiting is replaced by the next).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build the test app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # A short target dir outside the checkout (Windows path limits). The
      # rust-cache entry below points at the same folder: ../../../t from
      # desktop/src-tauri, i.e. <runner workspace>\t.
      - name: Short target dir
        shell: pwsh
        run: echo "YAP_E2E_TARGET_DIR=$((Resolve-Path "$env:GITHUB_WORKSPACE\..").Path)\t" >> $env:GITHUB_ENV

      # Saved even when the build fails, so the next run doesn't pay for a
      # cold build again.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> ../../../t"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the test app (stub engine, debug, frontend embedded)
        run: npm run test:app:build

      # Only the exe: a test run copies it into its own folder and never
      # needs anything else from the build (its symbols aren't beside the copy).
      - name: Hand the build to the shards
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app
          path: ${{ env.YAP_E2E_TARGET_DIR }}\debug\yap.exe
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: e2e (${{ matrix.shard }}/8)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Get the test app
        uses: actions/download-artifact@v8
        with:
          name: e2e-app
          path: ${{ runner.temp }}\e2e-app

      # Everything on a hosted runner runs elevated, and WebView2 ignores the
      # WEBVIEW2_* variables of an elevated app (the suite asks for its
      # DevTools port that way). A machine-wide policy still applies, so set
      # the same flag there for yap.exe:
      # https://learn.microsoft.com/microsoft-edge/webview2/concepts/security#for-an-elevated-host-app-use-appropriate-override-flags
      - name: Let WebView2 open a DevTools port for yap.exe
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name 'yap.exe' -Value '--remote-debugging-port=0'

      # This shard's spec files, by the time each took (desktop/e2e/timings.json).
      - name: Pick this shard's specs
        shell: bash
        run: node desktop/e2e/shards.mjs ${{ matrix.shard }}/${{ strategy.job-total }} > "$RUNNER_TEMP/e2e-shard.txt"

      - name: Run the e2e suite (this shard)
        env:
          YAP_E2E_EXE: ${{ runner.temp }}\e2e-app\yap.exe
          YAP_E2E_WORKERS: ${{ inputs.workers || '1' }}
        run: npx playwright test -c desktop/e2e --test-list "${{ runner.temp }}\e2e-shard.txt"

      - name: Upload screenshots, report and app logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            test-results/app
            !test-results/app/runs/*/app/yap.exe
            !test-results/app/runs/*/webview2
          if-no-files-found: warn
          retention-days: 14
