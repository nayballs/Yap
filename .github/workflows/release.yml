name: "Release"

# Build the signed-for-update (but NOT yet Authenticode-signed) Windows
# installer + updater manifest and attach them to a DRAFT GitHub Release.
#
# Required GitHub secrets:
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key (pairs with the
#                                       plugins.updater.pubkey in tauri.conf.json)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  password for that key (empty string if none)
#   GITHUB_TOKEN                        provided automatically by Actions
#
# NOT configured yet (the installer ships UNSIGNED for now): Authenticode.
# Planned via **SignPath Foundation** (free for OSS) — see docs/SIGNING.md for
# the full setup, incl. the auto-updater signing-order handling. When the
# SignPath account is approved, add the SIGNPATH_API_TOKEN secret and the
# sign-then-updater steps from that doc.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      # whisper-rs-sys' cmake build produces paths that exceed Windows MAX_PATH
      # (260 chars). Enable long paths + use a short target dir to stay under it.
      - name: Enable long paths (Windows)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # GPU whisper uses the VULKAN backend (universal — NVIDIA/AMD/Intel), which
      # needs the Vulkan SDK (glslc + headers + loader) to COMPILE ggml-vulkan.
      # Same step + version as nightly.yml — keep the two in sync.
      - name: Install Vulkan SDK (Windows x64)
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Shorten build path (Windows)
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          echo "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Build + release (Tauri)
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater (minisign) signing — required so latest.json is signed and
          # the in-app updater accepts the artifact.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Authenticode (SignPath Foundation, free OSS) — added once the account
          # is approved. Per docs/SIGNING.md the installer is signed AFTER build
          # and the updater signature is regenerated over the signed installer,
          # so this becomes a separate post-build step (not an env var here).
          # Secret required: SIGNPATH_API_TOKEN.
          # Disable -march=native / SIMD above SSE4.2 for the broadest CPU
          # compatibility — whisper.cpp CPU inference otherwise SIGILLs on old
          # CPUs lacking AVX/FMA. The default model (Parakeet V3) runs on ONNX +
          # DirectML and is unaffected.
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        with:
          # Same build as nightly minus its updater-endpoint override: whisper
          # on Vulkan, ONNX on DirectML — any Windows GPU, no CUDA. NSIS only:
          # installs come from the custom NSIS installer (normal/portable,
          # deep-link scheme), so latest.json must never point at an MSI.
          args: "--features engines --bundles nsis"
          updaterJsonPreferNsis: true
          # The draft targets the commit that was built. Run from a pushed
          # `v*` tag, or dispatch from main: publishing the draft creates the
          # tag then.
          tagName: v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseName: "Yap v__VERSION__"
          releaseDraft: true
          prerelease: false

      # A constant-name copy of the installer, so
      # https://github.com/nayballs/Yap/releases/latest/download/Yap-setup.exe
      # always fetches the newest stable (the README and website link it). The
      # updater ignores it: latest.json points at the versioned installer.
      # Re-running for the same version reuses the draft (tauri-action replaces
      # its own files), so drop the old copy and re-pin the draft to this build.
      - name: Attach constant-name installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          $exe = Get-ChildItem "$env:CARGO_TARGET_DIR\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $exe -or -not $env:RELEASE_ID -or -not $env:APP_VERSION) { throw "No NSIS installer, release id or version" }
          $release = "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          # Restate tag_name: GitHub turns a draft's tag into "untagged-…"
          # when an edit leaves it out.
          gh api -X PATCH $release -f tag_name="v$env:APP_VERSION" -f target_commitish=$env:GITHUB_SHA | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Couldn't pin the release to $env:GITHUB_SHA" }
          $old = (gh api "$release/assets" | ConvertFrom-Json) | Where-Object name -eq 'Yap-setup.exe'
          foreach ($a in $old) { gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)" | Out-Null }
          Copy-Item $exe.FullName Yap-setup.exe
          curl.exe --fail-with-body -sS -X POST `
            -H "Authorization: Bearer $env:GH_TOKEN" `
            -H "Content-Type: application/octet-stream" `
            --data-binary "@Yap-setup.exe" `
            "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=Yap-setup.exe" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Upload failed ($LASTEXITCODE)" }
          Write-Host "Attached Yap-setup.exe (copy of $($exe.Name))"
