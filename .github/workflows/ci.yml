# Fast sanity checks on EVERY push/PR so a broken commit can never reach a
# nightly. This intentionally builds the STUB (no `--features engines`): no
# Vulkan SDK, no whisper/ONNX compile — it verifies all of Yap's own Rust and
# the frontend in a few minutes. The real GPU pipeline is exercised by the
# nightly + release builds (which is where its failures are meaningful).
name: "CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The privacy guard reads the commits a push adds, not only the tip.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Quick, and first: nothing secret or personal in what was pushed. CI has
      # no private terms file (it stays on the maintainer's PC; the pre-push
      # hook checks those), so this is the generic part — API keys, email
      # addresses, UK phone numbers — over the whole tree and over the commits
      # this push or PR adds; then the guard's own tests.
      - name: Privacy guard (keys, emails, phone numbers)
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/privacy-guard.mjs --scan-tree
          if [ -n "$BASE" ] && ! echo "$BASE" | grep -qE '^0+$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/privacy-guard.mjs --range "$BASE..$HEAD_SHA" --no-private
          fi
          node --test scripts/privacy-guard.test.mjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Also produces dist/, which tauri's generate_context! requires to exist
      # before the Rust side can compile — keep this BEFORE cargo check.
      - name: Build frontend
        run: npm run build

      # Clippy subsumes cargo check. -D warnings is the ratchet: the codebase
      # is at zero warnings (2026-07-02), so any new warning — dead code,
      # unused imports, clippy lints — fails the push instead of accumulating.
      # --all-targets lints the unit tests too (clean since 2026-10-05).
      - name: Cargo clippy (stub build, deny warnings)
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # The release profile too (lib + exe, what the installers build): code
      # only debug builds call (the e2e hooks, the model evaluations) is dead
      # there, and that showed up as warnings nobody saw until a release.
      # Checking only, no code generation: ~1.5 min cold on a 16-thread PC,
      # less with the Rust cache warm.
      - name: Cargo clippy (release profile, deny warnings)
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --release -- -D warnings

  # The phone app (phone/web/): its sound maths in Node, then the page in a
  # headless Chromium and Firefox against a mocked PC (`npm run test:link`).
  # No Yap build, nothing on the network: a few minutes, beside `check`.
  # Windows, as the maintainer runs it (Sound details' "… on Windows").
  phone:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium and Firefox
        run: npx playwright install chromium firefox

      - name: The phone page's sound maths
        run: node --test phone/web/tests/dsp.test.mjs

      - name: The phone page in Chromium
        env:
          YAP_LINK_FIREFOX: "0"
        run: npx playwright test -c phone/web/tests --project=link --project=handsfree

      # Not required yet (4 Nov 2026): on the runner Firefox's fake mic never
      # opens, though every Firefox spec passes on a PC (with its pretend
      # sound device, as here). Its results go up below until it's found.
      - name: The phone page in Firefox (not required yet)
        id: firefox
        continue-on-error: true
        env:
          YAP_LINK_FIREFOX: "1"
        # Stopped after a few failures: while it fails, the rest only wait.
        run: npx playwright test -c phone/web/tests --project=firefox --max-failures=8 --retries=0

      - name: Upload the phone tests' screenshots and traces
        if: failure() || steps.firefox.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: phone-results
          path: test-results/link
          if-no-files-found: warn
          retention-days: 14
