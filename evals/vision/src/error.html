<!doctype html>
<!-- A made-up Windows-style error dialog (Snip to Chat's screenshot evaluations). -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 960px; height: 600px; background: linear-gradient(135deg, #2d5f8b, #6c8fb3); display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", sans-serif; }
  .dlg { width: 560px; background: #fff; border: 1px solid #7a7a7a; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
  .title { height: 32px; display: flex; align-items: center; padding-left: 12px; font-size: 12px; color: #111; border-bottom: 1px solid #e5e5e5; }
  .title .x { margin-left: auto; width: 46px; text-align: center; font-size: 14px; }
  .body { display: flex; gap: 16px; padding: 22px 24px 16px; }
  .icon { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #c42b1c; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; }
  h1 { font-size: 17px; font-weight: 600; margin: 4px 0 8px; color: #1b1b1b; }
  p { margin: 0 0 8px; font-size: 13px; color: #333; line-height: 1.45; }
  .code { font-family: Consolas, monospace; background: #f3f3f3; padding: 6px 8px; font-size: 12.5px; }
  .foot { background: #f3f3f3; padding: 14px 24px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid #e5e5e5; }
  button { font: 13px "Segoe UI", sans-serif; min-width: 86px; padding: 5px 12px; border: 1px solid #c4c4c4; background: #fdfdfd; border-radius: 4px; }
  button.primary { background: #0067c0; color: #fff; border-color: #0067c0; }
</style>
<div class="dlg">
  <div class="title">Northwind Backup<span class="x">✕</span></div>
  <div class="body">
    <div class="icon">✕</div>
    <div>
      <h1>The backup couldn't finish</h1>
      <p>Job "Weekly photos" stopped while copying to \\nas-01\archive after 1,284 of 3,902 files.</p>
      <p class="code">Error 0x8007003A: The specified network name is no longer available.</p>
      <p>Last successful backup: Saturday 3 October 2026, 23:10.</p>
    </div>
  </div>
  <div class="foot"><button>Details</button><button>Close</button><button class="primary">Retry</button></div>
</div>
