[package]
name = "yap"
version = "0.2.0"
description = "Yap — a tiny local voice dictation pill"
license = "MIT"
authors = [""]
edition = "2021"

[lib]
name = "yap_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# `deep-link` forwards a com.contextmirror.yap:// sign-in link that launched a
# second process into the running instance (auth.rs). Held on 2.4.x with
# deep-link below. 2.5+ needed tauri 2.12, which Yap is on since Nov 2026, but
# 2.5.5 lets the lock go in `cleanup_before_exit` (the updater's exit hook calls
# it): their own change, checked on an installed nightly (deep links and
# updates only reach an installed Yap).
tauri-plugin-single-instance = { version = "~2.4.2", features = ["deep-link"] }
tauri-plugin-deep-link = "~2.4.10"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Remembers the main window's size/position across launches (OpenWhispr opens
# fixed 1200x800 every time — we match their size and go one better).
tauri-plugin-window-state = "2"
# Audio-file decode for Upload (media.rs): pure-Rust, no ffmpeg. Defaults give
# wav/flac/ogg-vorbis/pcm; mp3 + aac + isomp4 add mp3/m4a/aac.
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
serde = { version = "1", features = ["derive"] }
# raw_value: mcp_clients.rs edits AI apps' config files keeping every other
# entry byte for byte (their own formatting and key order).
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"
tracing = "0.1"
# env-filter for RUST_LOG; the reload module (Debug-mode live toggle) comes
# with the default "registry"/"std" features — no extra flag.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rolling FILE log so installed (windowed) builds are debuggable — stdout is
# invisible without a console attached.
tracing-appender = "0.2"
regex = "1"
once_cell = "1"
# The language a dictation's text is in, for models that don't say which they
# heard (languages/text_id.rs: "You spoke French" with Parakeet V3). Trigram
# profiles, pure Rust, MIT, no network; ~0.3 MB; lingua was +145 MB for the
# same languages. 0.18 (Nov 2026): Welsh added (never a candidate here: Yap
# always asks with an allowlist of the catalog's languages, so the others'
# scores and picks are what 0.16 gave), once_cell swapped for std's LazyLock,
# edition 2024; its hashbrown 0.15 (foldhash) takes the place of 0.16's 0.14
# (ahash), which nothing else in the Windows build used once tauri 2.12 came
# in (a Linux-only crate keeps 0.14 in Cargo.lock): still three hashbrowns.
whatlang = "0.18"

# Audio capture (the mic, a meeting's loopback) + playback (Yap's sounds,
# spoken replies). rodio builds on one cpal minor (0.22 on 0.17): they move
# together, one cpal in the tree. cpal 0.17's `name()` is Windows' bare
# "Microphone", so Yap names devices itself (dictation/mics.rs
# `device_name`) and finds a mic by its endpoint id (`input_device`).
# rodio's playback only: Yap plays the PCM it makes, never a file, so none
# of its decoders, its microphone or its dither.
cpal = "0.17"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

# Clipboard for text injection
arboard = "3"

# Local API bridge (Integrations): a tiny loopback HTTP server (bridge.rs,
# OpenWhispr cliBridge port) + CSPRNG for its bearer token.
tiny_http = "0.12"
getrandom = "0.3"

# MCP server (`yap.exe mcp`, mcp.rs): AI apps read meeting notes through the
# bridge. The official Rust SDK, server + stdio only (no macros): it speaks
# both protocol eras (the 2025 `initialize` handshake and 2026-07-28's
# per-request metadata). toml_edit adds Yap to Codex/ChatGPT's config.toml
# without touching the rest of the file; chrono's clock shows meeting dates in
# local time. Both were already in the dependency tree.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
toml_edit = "0.25"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Yap accounts (auth.rs): base64/url decode the browser handoff code. 0.23,
# the copy tauri-plugin-updater 2.14 builds on.
base64 = "0.23"
url = "2"
# Sign in with your phone (auth.rs): the QR code, made locally. The encoder
# alone (no image/SVG renderers, no dependencies); the Account page draws it.
qrcode = { version = "0.14", default-features = false }

# Yap Link (link.rs): a phone on the home Wi-Fi talks to Yap over HTTPS and a
# WebSocket that Yap serves itself. TLS on the rustls already in the tree,
# with ring (no CMake or NASM on MSVC: never aws-lc-rs); its self-signed
# certificate made here by rcgen, on ring too. The WebSocket's framing from
# tungstenite, without its handshake (Yap reads the HTTP request itself, to
# serve the page's files on the same port) or any TLS of its own; sha1 for
# the handshake's accept key (0.11, on the digest sha2 below uses).
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
sha1 = "0.11"

# Calendar (calendar.rs): meetings read straight from Google Calendar or a
# private iCal link. `rrule` expands RFC 5545 recurrence rules (the crate the
# `icalendar` crate builds on); `chrono-tz` is the IANA time-zone database,
# for TZIDs (Windows zone names are mapped to it, see calendar/tz.rs). Both
# work on the `chrono` above.
chrono-tz = "0.10"
rrule = "0.14"

# Call apps' own icons (app_icons.rs): an exe's icon, drawn by Windows, saved
# as a PNG. Already built for arboard's image support; this just names it.
png = "0.18"

# Model download + directory-model extract/verify (used by stt.rs)
reqwest = { version = "0.12", features = ["stream", "json"] }
# Network receipts (net.rs): an answer's body counted as it's read, its
# size hint kept. The http-body 1 reqwest itself builds on: no new copy.
http-body = "1"
# Chat's `read_page` (web.rs): a web page's readable text, on this PC — a
# close port of Mozilla's readability.js (MIT). 0.18 builds on the same
# dom_query (0.28, html5ever 0.39) tauri-utils 2.10 (tauri 2.12) already pulls
# in, so there's no second HTML parser in the tree: dom_query and dom_smoothie
# move when tauri-utils' dom_query does (0.29 / dom_smoothie 0.19 would be a
# second copy).
dom_smoothie = "0.18"
# …and the HTML a wiki's `action=parse` returns, as text (the same copy).
dom_query = "0.29"
futures-util = "0.3"
# Downloads checked, secrets' hashes, the search index's keys. 0.11 (Nov
# 2026, digest 0.11): a digest is no longer `LowerHex`, so the hex is written
# out byte by byte; the same hashes (the published vectors, tested). tauri's
# build-time macros still build on 0.10, which never reaches the app.
sha2 = "0.11"
# Sign in with ChatGPT's ID-token signature (RS256; already in the tree through rustls).
ring = "0.17"
flate2 = "1"
tar = "0.4"
# The speaker-diarization runtime (diarize.rs) comes as NVIDIA's zip. Only
# its Deflate entries are read (flate2 is above). 9.0.5+: older versions
# have the zip-cloaking and symlink advisories (Dependabot, 31 Oct 2026).
zip = { version = "9.2", default-features = false, features = ["deflate-flate2"] }

# Multi-engine STT (whisper.cpp + ONNX) via transcribe-rs. Optional so the
# default build ships the STUB and `cargo check` stays fast.
transcribe-rs = { version = "0.3", optional = true, default-features = false }
# Kokoro, the natural voice of spoken replies (tts/kokoro.rs), runs on the
# same ONNX Runtime transcribe-rs links (pinned to its exact version, so
# Cargo unifies one ort-sys): no second runtime, no sidecar. CPU only.
ort = { version = "=2.0.0-rc.12", optional = true }

# Auto-update via GitHub Releases, driven from Rust (updates.rs: background
# checks + download, install on request; relaunch is the installer's /R).
# Desktop-only crate, so it lives under a non-mobile target block. No "zip"
# feature: Yap's updates are the setup .exe itself (createUpdaterArtifacts:
# true, never v1's .nsis.zip), and that feature pins zip 4 with its advisories.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }

# Windows UI Automation — read the focused control's text selection for
# edit/rewrite mode. Version matches the `windows` crate tauri 2 already pulls
# in (0.62.x since tauri 2.12 / wry 0.57) so there's no duplicate copy of the
# crate: `windows`, `windows-core` and `webview2-com` move together, with tauri.
[target.'cfg(windows)'.dependencies]
# ToolHelp + Threading: procs.rs (tell an orphaned sidecar from another Yap's).
# UI_Notifications + Data_Xml_Dom (+ Foundation_Collections for its progress
# bar data): the update Windows notifications;
# Networking_Connectivity: skip background update downloads on metered
# connections (updates.rs).
# Registry + SystemInformation: call detection reads Windows' per-app
# microphone record and the local time for a meeting note's title
# (meeting_detect.rs).
# Ole + Variant: a text range's read-only attribute (selection.rs reads the
# text around the cursor). DataExchange + Memory: the paste's clipboard
# write, with the formats that keep a dictation out of Win+V history and
# cloud clipboard sync (text_injector.rs). Media_Control: "Pause music and
# videos while you dictate" (media_pause.rs, Windows' media controls).
# Media_SpeechSynthesis (+ Media_Core and Storage_Streams, which its audio
# stream needs): spoken replies with Windows' voices (tts.rs).
# UI_Shell (+ Shell_Common, Graphics_Gdi, WindowsAndMessaging): opening apps
# when asked — the Start menu's app list (shell:AppsFolder), launching an
# entry of it, and its icons (apps.rs); Com_StructuredStorage: an entry's
# Start menu shortcut (a PROPVARIANT property). Already built for tao/wry.
# Graphics_Dxgi: the graphics card's own memory, which picks the on-device
# model recommended for this PC (gpu.rs). Storage_FileSystem: the free disk
# space a download checks first (local_llm.rs).
# Snip to Chat (snip.rs): Windows.Graphics.Capture (Graphics_Capture,
# Graphics_DirectX*, the WinRT interop and Direct3D 11 to read a frame back,
# FP16 on an HDR monitor), DisplayConfig's HDR state and SDR white level
# (Devices_Display), the overlay's DWM cloak (Graphics_Dwm), per-monitor DPI
# (HiDpi), its keys (Input_KeyboardAndMouse) and the borderless-capture
# request's status (Security_Authorization_AppCapabilityAccess). All in the
# same windows 0.62: no second copy. Its phase 2: Windows' own OCR for "Send
# its text instead" (Media_Ocr, with Graphics_Imaging's SoftwareBitmap and
# Globalization's languages), and Graphics_Imaging's decoders for pictures
# pasted or dropped into Chat (JPEG, GIF, BMP, WebP…: no image crate).
# Yap Link (link/lan.rs): this PC's addresses on its networks (IpHelper's
# GetAdaptersAddresses, WinSock's addresses, Ndis's interface kinds) and
# whether Windows marks a network Public (NetworkListManager).
# LibraryLoader: GetModuleHandleW for the windows Yap registers itself (the
# clipboard window, read_check.rs; the snip overlay and snip-dump). Named here
# since wry 0.57 (tauri 2.12) no longer turns it on for the copy Yap shares.
windows = { version = "0.62", features = ["Win32_System_LibraryLoader", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_Devices_Display", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Security_Authorization_AppCapabilityAccess", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Foundation", "Foundation_Collections", "UI_Notifications", "Data_Xml_Dom", "Networking_Connectivity", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Variant", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Globalization", "Win32_System_Time", "Media_Control", "Media_SpeechSynthesis", "Media_Core", "Storage_Streams", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Dxgi", "Win32_Storage_FileSystem", "Media_Ocr", "Graphics_Imaging", "Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Networking_NetworkListManager"] }
# Core Audio's device notifications (`dictation/mics/watch.rs`): the
# `#[implement]` of an `IMMNotificationClient` names `::windows_core`. The
# same copy the `windows` crate above is built on (already in the tree).
windows-core = "0.62"
# Yap accounts: the session token lives in Windows Credential Manager. The
# keyring crate's own docs steer apps to keyring-core + the one store they use.
keyring-core = "1"
windows-native-keyring-store = "1"
# No browser context menu in Yap's windows (context_menu.rs): WebView2's
# ContextMenuRequested event, filtered to the editing commands. The same
# webview2-com wry already builds on (0.39, over windows 0.62): no new copy.
webview2-com = "0.39"
# `yap.exe diarize` (diarize.rs) loads NeMo-Speech.cpp's C API DLLs from the
# data folder with LoadLibraryExW(…DLL_LOAD_DIR | DEFAULT_DIRS), so their own
# ggml and MSVC runtime come from that folder. 0.9 (Nov 2026): the same
# LoadLibraryExW / GetProcAddress calls, the path as its `AsFilename` (an
# interior NUL now an error, never cut short); a stub build compiles it, only
# the real runtime loading proves it (desktop/e2e/diarization-real.spec.js).
libloading = "0.9"

[features]
# Default has NO transcribe-rs so plain `cargo check` compiles the stub (fast).
default = []
# Real multi-engine STT with UNIVERSAL GPU acceleration (any Windows GPU, no CUDA):
#   - whisper.cpp on the VULKAN backend (NVIDIA/AMD/Intel; vulkan-1.dll ships with
#     the GPU driver, and it falls back to CPU when no Vulkan device is present)
#   - ONNX Runtime on DirectML (Parakeet/Moonshine/etc.)
# Mirrors Handy's Windows target. Requires the Vulkan SDK at BUILD time (glslc +
# headers + loader); CI installs it via humbletim/install-vulkan-sdk. This is what
# release/nightly builds use — one small installer, GPU on every GPU.
engines = [
    "dep:transcribe-rs",
    "dep:ort",
    "transcribe-rs/onnx",
    "transcribe-rs/whisper-cpp",
    "transcribe-rs/whisper-vulkan",
    "transcribe-rs/ort-directml",
]
# Back-compat alias.
whisper = ["engines"]
# REQUIRED for release/standalone builds: makes the app load the EMBEDDED
# frontend via the custom protocol instead of the dev-server URL. Without it
# a `cargo build --release` run still points at http://localhost:1430.
# `tauri build` enables this automatically; bare `cargo build` does not.
custom-protocol = ["tauri/custom-protocol"]

# Snip to Chat (snip.rs) encodes a screenshot as PNG while you wait, and
# base64s a copy for the model: unoptimised, as a debug build (Yap - Dev,
# the e2e suite) compiles them, a 2560×1440 screen took 1.4 s to encode
# instead of tens of ms (the snip-dump spike, docs/architecture/snip.md).
# These few small crates are optimised in dev builds too; nothing else is.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3

# transcribe-rs 0.3.11 with two DirectML fixes for Parakeet, vendored (see
# vendor/transcribe-rs/YAP.md): the decoder/joiner and the preprocessor run
# on the CPU, and the encoder always gets the input length it planned for.
[patch.crates-io]
transcribe-rs = { path = "vendor/transcribe-rs" }
