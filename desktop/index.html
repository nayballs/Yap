<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yap</title>
    <script>
      // Before the first paint (lib/core/appearance.js does the rest once the app
      // loads): name the window, so app.css gives the opaque ones their
      // background, and put on the theme the last page saw (Settings →
      // General → Appearance → Theme, kept in this origin's localStorage by
      // appearance.js; "system" = Windows' app mode). Without this a dark
      // Yap would paint one light frame on a reload. Rust gives the opaque
      // windows' webviews the same background (theme.rs).
      (function () {
        var root = document.documentElement;
        try {
          var label = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.metadata.currentWindow.label;
          // A Markdown file's window (`doc-<hash>`, one per file) is a "doc".
          if (label) root.dataset.window = label.indexOf('doc-') === 0 ? 'doc' : label;
        } catch (e) {}
        var theme = 'system';
        var bar = 'app';
        try {
          theme = localStorage.getItem('yap.theme') || 'system';
          bar = localStorage.getItem('yap.barTheme') || 'app';
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
        root.dataset.yapTheme = dark ? 'dark' : 'light';
        root.dataset.barTheme = bar === 'dark' || bar === 'light' ? bar : dark ? 'dark' : 'light';
      })();
      // A file of the app's that couldn't be fetched fails the whole page:
      // a module script's error event fires when any file it imports can't
      // be loaded, and nothing runs. 19 Nov 2026: one font stylesheet refused
      // by the dev server as Yap started left the main window blank until a
      // restart. So the page loads again — at most twice a minute, so a page
      // that can never load doesn't reload for ever. The window's own view
      // (App.svelte's `import()`) does the same when it can't load.
      window.__yapLoadFailed = function (what) {
        var now = Date.now();
        try {
          var key = 'yap.loadRetries';
          var recent = JSON.parse(sessionStorage.getItem(key) || '[]').filter(function (t) {
            return now - t < 60000;
          });
          if (recent.length >= 2) return;
          recent.push(now);
          sessionStorage.setItem(key, JSON.stringify(recent));
        } catch (e) {
          if (window.__yapLoadRetried) return;
          window.__yapLoadRetried = true;
        }
        try {
          console.warn('[yap] ' + what + " couldn't load; loading the page again");
        } catch (e) {}
        setTimeout(function () {
          location.reload();
        }, 500);
      };
      // (A script's error event doesn't bubble: caught on its way down.)
      document.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT' && t.type === 'module') window.__yapLoadFailed('the app');
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
