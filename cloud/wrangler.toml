# Yap accounts: Better Auth on Cloudflare Workers + D1 (see README.md).
name = "yap-auth"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Better Auth needs AsyncLocalStorage + node:crypto.
compatibility_flags = ["nodejs_compat"]

# Production domain (Workers Custom Domain: Cloudflare manages its DNS + cert).
routes = [{ pattern = "auth.contextmirror.com", custom_domain = true }]
# Served only at the custom domain: one public origin for cookies and links.
workers_dev = false
preview_urls = false

# Production values. `wrangler dev` overrides them from .dev.vars.
[vars]
BETTER_AUTH_URL = "https://auth.contextmirror.com"
EMAIL_FROM = "Yap <no-reply@mail.contextmirror.com>"
# OAuth client ids are public (they appear in every sign-in URL); their
# secrets are Worker secrets. A provider switches on when both are set.
GITHUB_CLIENT_ID = "Ov23li7Hi7DTY8mtHKPR"   # github.com/settings/applications/3897989
# Google Cloud project yap-accounts → Google Auth Platform → Clients → "Yap account service"
GOOGLE_CLIENT_ID = "575066617296-e3op5up8i4n5t9s6o6re9g4m7rcn45uu.apps.googleusercontent.com"
DISCORD_CLIENT_ID = "1556416670472601620"   # discord.com/developers/applications/1556416670472601620 ("Yap")

[[d1_databases]]
binding = "DB"
database_name = "yap-auth"
# Production database (WEUR). Local dev uses its own copy under .wrangler/
database_id = "fb03bf43-1271-43c9-981b-41be5dedf590"
migrations_dir = "migrations"

# Static pages (sign-in return page, privacy, terms). Requests that match a
# file are served directly; everything else (/api/*) reaches the Worker.
[assets]
directory = "./public"
